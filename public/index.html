<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calculator</title>
	</head>

	<body>
		<label class="theme-toggler__container" id="theme-toggler">
			<input
				type="checkbox"
				class="theme-toggler__checkbox"
				aria-label="Toggle theme"
			/>
			<span
				class="theme-toggler__button"
				role="switch"
				aria-checked="false"
			></span>
		</label>
		<div class="calculator">
			<input
				type="text"
				value=""
				placeholder="0"
				class="calculator__display"
				value=""
			/>
			<div class="calculator__buttons"></div>
		</div>
	</body>
	<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</html>
