<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
		<title>Calculator</title>
	</head>

	<body>
		<div class="app">
			<label class="theme-toggler__container theme-toggler">
				<input type="checkbox" class="theme-toggler__checkbox" aria-label="Toggle theme" />
				<span class="theme-toggler__button" role="switch" aria-checked="false"></span>
			</label>
			<div class="calculator">
				<input type="text" value="" disabled placeholder="0" class="calculator__display" value="" />
				<div class="calculator__buttons"></div>
				<input type="text" disabled hidden class="calculator__error" />
			</div>
		</div>
	</body>
	<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</html>
